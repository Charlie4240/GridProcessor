defaults:
  run:
    working-directory: .

...

- name: Build release APK
  run: |
    gradle clean :app:assembleRelease \
      --stacktrace \
      --console=plain \
      --no-daemon

- name: Upload release APK
  uses: actions/upload-artifact@v4
  with:
    name: GridProcessor-release-apk
    path: app/build/outputs/apk/release/*.apk
    if-no-files-found: error
