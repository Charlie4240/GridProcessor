name: GridProcessor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GridProcessor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34.0.0|cmake;3.22.1|ndk;25.1.8937393' || true

      - name: Build release APK
        run: |
          gradle clean :app:assembleRelease \
            --stacktrace \
            --console=plain \
            --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GridProcessor-release-apk
          path: GridProcessor/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
