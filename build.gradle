// Top-level build file
buildscript {
    ext.kotlin_version = '1.9.0'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
// NOTE: allprojects{ repositories{...} } removed — it conflicted with
// settings.gradle's dependencyResolutionManagement (FAIL_ON_PROJECT_REPOS),
// which already centralizes repositories and would fail the build otherwise.